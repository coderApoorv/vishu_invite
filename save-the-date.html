<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save The Date | Shreya & Shubham</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Great+Vibes&family=Outfit:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Schoolbell&display=swap');

    .font-heading { font-family: 'Outfit', sans-serif; }
    .font-editorial { font-family: 'Playfair Display', serif; }
    .font-script { font-family: 'Caveat', 'Great Vibes', cursive; }
    .font-chalk { font-family: 'Schoolbell', 'Caveat', cursive; }

    /* Animated cursive handwriting draw-in */
    @keyframes cursiveDrawIn {
      0% {
        clip-path: polygon(0 0, 0 0, 0 100%, 0 100%);
        opacity: 0;
      }
      30% {
        opacity: 1;
      }
      100% {
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        opacity: 1;
      }
    }
    .anim-cursive-write {
      animation: cursiveDrawIn 2.2s cubic-bezier(0.4, 0, 0.2, 1) 3.5s forwards;
      clip-path: polygon(0 0, 0 0, 0 100%, 0 100%);
      opacity: 0;
    }

    /* Soft Paper Texture Background */
    .paper-texture {
      background-color: #FAF6F0;
      background-image: 
        radial-gradient(#d5cbb8 0.6px, transparent 0.6px),
        radial-gradient(#e2d9ca 0.6px, #faf6f0 0.6px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
    }
  </style>
</head>
<body class="paper-texture text-[#2b2523] min-h-screen flex flex-col justify-between selection:bg-rose-200 selection:text-rose-900 overflow-x-hidden">

  <!-- Top Controls Bar -->
  <header class="w-full max-w-md mx-auto pt-4 px-4 flex justify-between items-center z-30">
    <!-- Back to Royal Wedding Card -->
    <a href="index.html" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-white/90 backdrop-blur-md border border-[#d6c4b2] text-xs font-heading font-semibold text-[#6e202e] hover:bg-[#6e202e] hover:text-white transition shadow-xs">
      <span>📜</span> Main Wedding Card
    </a>

    <div class="flex items-center gap-2">
      <!-- Replay Video Button -->
      <button onclick="replayVideo()" title="Replay Video" class="px-3 py-1.5 rounded-full bg-white/90 backdrop-blur-md border border-[#d6c4b2] text-xs font-heading font-semibold text-[#6e202e] hover:bg-rose-50 transition shadow-xs flex items-center gap-1">
        <span>🔁</span> <span class="text-[11px]">Replay</span>
      </button>

      <!-- Sound Toggle Button -->
      <button id="soundBtn" onclick="toggleAudio()" class="px-3 py-1.5 rounded-full bg-white/90 backdrop-blur-md border border-[#d6c4b2] text-xs font-heading font-semibold text-[#6e202e] hover:bg-rose-50 transition shadow-xs flex items-center gap-1.5">
        <span id="soundIcon">🔊</span>
        <span class="text-[11px]" id="soundText">Sound On</span>
      </button>
    </div>
  </header>

  <!-- Main Card Container -->
  <main class="w-full max-w-[420px] mx-auto px-4 py-3 flex-1 flex flex-col items-center justify-center relative">
    
    <div class="w-full bg-[#FFFDF9] rounded-3xl p-3.5 shadow-[0_20px_60px_rgba(110,32,46,0.14)] border-2 border-[#E8DCCF] relative overflow-hidden flex flex-col items-center">
      
      <!-- Reel Frame Container with exact 9:16 aspect ratio -->
      <div id="videoContainer" class="relative w-full rounded-2xl overflow-hidden bg-black shadow-inner aspect-[9/16] select-none">
        
        <!-- The Original High-Definition Reel Video -->
        <video id="reelVideo" src="assets/reel.mp4" autoplay loop playsinline class="w-full h-full object-cover"></video>

        <!-- ========================================================================= -->
        <!-- SEAMLESS PERSONALIZED OVERLAYS (SHREYA & SHUBHAM & JANUARY 2027)          -->
        <!-- ========================================================================= -->

        <!-- 1. TOP TEXT OVERLAY (Replaces "November" with "January") -->
        <div class="absolute top-[4.2%] inset-x-[8%] h-[15.8%] flex flex-col items-center justify-center text-center pointer-events-none z-10" style="background: linear-gradient(to bottom, #FFFFFF 0%, #FFFFFF 85%, rgba(255,255,255,0) 100%);">
          <div class="text-[13px] sm:text-[14px] font-heading font-medium text-[#1A1A1A] leading-[1.35] tracking-wide">
            Warning:<br>
            My angry bird is becoming my<br>
            wife this January.
          </div>
          <div class="font-script text-[32px] sm:text-[38px] font-bold text-[#A32A29] -mt-1 leading-none anim-cursive-write">
            Save our month
          </div>
        </div>

        <!-- 2. MOUNTED CHALKBOARD OVERLAY (Replaces "Nehal & Parth" with "Shreya & Shubham") -->
        <div class="absolute top-[67.2%] left-[64.2%] w-[8.6%] h-[9.8%] rounded-[2px] bg-[#222D24] border-[1.5px] border-[#3D291F] flex flex-col items-center justify-center text-center p-0.5 shadow-xs pointer-events-none z-10 overflow-hidden">
          <span class="font-chalk text-[8px] sm:text-[9px] font-bold text-white leading-tight">Shreya</span>
          <span class="font-script text-[8.5px] sm:text-[9.5px] text-[#E59883] leading-none my-0.5">&</span>
          <span class="font-chalk text-[8px] sm:text-[9px] font-bold text-white leading-tight">Shubham</span>
        </div>

        <!-- 3. SIDEWALK EASEL OVERLAY (Replaces "29.11.26" with "29.01.27") -->
        <div class="absolute top-[88.3%] left-[68.8%] w-[8.2%] h-[6.5%] rounded-[2px] bg-[#1C261F] flex flex-col items-center justify-center text-center pointer-events-none z-10">
          <span class="font-heading font-black text-[9px] sm:text-[10px] text-white tracking-tighter leading-none">29.01</span>
          <span class="font-heading font-bold text-[8px] sm:text-[9px] text-[#FFCDD2] tracking-tighter leading-none mt-0.5">27</span>
        </div>

      </div>

      <!-- Clean Couple Names & Date Footer -->
      <div class="w-full mt-3 text-center space-y-0.5">
        <h2 class="text-2xl md:text-3xl font-editorial font-bold text-[#6e202e] tracking-wide">
          Shreya & Shubham
        </h2>
        <p class="text-xs md:text-sm font-heading font-bold text-[#3a2c26]">
          Friday, 29th January, 2027 &bull; Varanasi
        </p>
      </div>

    </div>

  </main>

  <!-- Bottom Link to Full Invitation -->
  <footer class="w-full max-w-md mx-auto py-3 px-4 text-center z-20">
    <div class="flex items-center justify-center gap-2 text-xs text-[#705649] font-heading">
      <span>Looking for ceremonies & venue details?</span>
      <a href="index.html" class="font-bold text-[#6e202e] underline hover:text-black">
        Open Wedding Card ›
      </a>
    </div>
  </footer>

  <script>
    const video = document.getElementById('reelVideo');
    const soundBtn = document.getElementById('soundBtn');
    const soundIcon = document.getElementById('soundIcon');
    const soundText = document.getElementById('soundText');

    // Start with sound enabled if user has interacted, or muted autoplay fallback
    video.muted = false;
    video.play().catch(() => {
      video.muted = true;
      video.play();
      soundIcon.innerText = '🔇';
      soundText.innerText = 'Unmute';
    });

    function toggleAudio() {
      if (video.muted) {
        video.muted = false;
        soundIcon.innerText = '🔊';
        soundText.innerText = 'Sound On';
      } else {
        video.muted = true;
        soundIcon.innerText = '🔇';
        soundText.innerText = 'Unmute';
      }
    }

    function replayVideo() {
      video.currentTime = 0;
      video.play();
      
      // Re-trigger handwriting animation
      const script = document.querySelector('.anim-cursive-write');
      if (script) {
        script.classList.remove('anim-cursive-write');
        void script.offsetWidth;
        script.classList.add('anim-cursive-write');
      }
    }
  </script>
</body>
</html>
