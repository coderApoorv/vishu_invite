<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save The Date | Shreya & Shubham</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Great+Vibes&family=Outfit:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Schoolbell&display=swap');

    .font-heading { font-family: 'Outfit', sans-serif; }
    .font-editorial { font-family: 'Playfair Display', serif; }
    .font-script { font-family: 'Caveat', 'Great Vibes', cursive; }
    .font-chalk { font-family: 'Schoolbell', 'Caveat', cursive; }

    /* ======================================================== */
    /* EXACT INSTAGRAM REEL ANIMATIONS                          */
    /* ======================================================== */

    /* 1. Vespa Ride-In Animation */
    @keyframes vespaDriveIn {
      0% {
        transform: translate(-320px, 135px);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      75% {
        transform: translate(120px, 133px);
      }
      88% {
        transform: translate(105px, 137px) rotate(-1.5deg);
      }
      100% {
        transform: translate(110px, 135px) rotate(0deg);
      }
    }
    .anim-vespa-drive {
      animation: vespaDriveIn 2.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    /* Idle engine vibration after driving in */
    @keyframes scooterEngineIdle {
      0%, 100% { transform: translate(110px, 135px); }
      50% { transform: translate(110px, 132px); }
    }
    .anim-vespa-idle {
      animation: scooterEngineIdle 2.2s ease-in-out infinite;
    }

    /* 2. Exhaust Smoke Puffs */
    @keyframes exhaustSmoke {
      0% { opacity: 0; transform: scale(0.3) translate(0, 0); }
      40% { opacity: 0.9; }
      100% { opacity: 0; transform: scale(1.6) translate(-45px, -20px); }
    }
    .smoke-puff-1 { animation: exhaustSmoke 1.8s ease-out 0.8s infinite; }
    .smoke-puff-2 { animation: exhaustSmoke 1.8s ease-out 1.4s infinite; }

    /* 3. Swaying Heart Balloons */
    @keyframes swayBalloons {
      0%, 100% { transform: rotate(-5deg) translateY(0); }
      50% { transform: rotate(6deg) translateY(-8px); }
    }
    .animate-balloons {
      transform-origin: bottom center;
      animation: swayBalloons 3.8s ease-in-out infinite;
    }

    /* 4. Angry Bird Hop & Chirp */
    @keyframes birdHop {
      0%, 82%, 100% { transform: translateY(0) rotate(0); }
      86% { transform: translateY(-5px) rotate(-8deg); }
      92% { transform: translateY(-2px) rotate(6deg); }
    }
    .animate-bird {
      transform-origin: bottom center;
      animation: birdHop 3.5s ease-in-out infinite;
    }

    /* 5. Cursive "Save our Date" Handwriting Reveal */
    @keyframes cursiveDrawIn {
      0% {
        clip-path: polygon(0 0, 0 0, 0 100%, 0 100%);
        opacity: 0;
        transform: scale(0.92) rotate(-3deg);
      }
      30% {
        opacity: 1;
      }
      100% {
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        opacity: 1;
        transform: scale(1) rotate(-2deg);
      }
    }
    .anim-cursive-write {
      animation: cursiveDrawIn 1.6s cubic-bezier(0.4, 0, 0.2, 1) 1.2s forwards;
      clip-path: polygon(0 0, 0 0, 0 100%, 0 100%);
      opacity: 0;
    }

    /* 6. Top Warning Dropdown with Bounce */
    @keyframes warningDrop {
      0% {
        opacity: 0;
        transform: translateY(-25px) scale(0.92);
      }
      60% {
        opacity: 1;
        transform: translateY(3px) scale(1.02);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .anim-warning-drop {
      animation: warningDrop 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
      opacity: 0;
    }

    /* 7. Chalkboards Appear */
    @keyframes chalkFade {
      0% { opacity: 0; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }
    .anim-chalk-appear {
      animation: chalkFade 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 1.4s forwards;
      opacity: 0;
    }

    /* 8. Pout Steam Bubble */
    @keyframes steamPuff {
      0%, 100% { opacity: 0.3; transform: scale(0.9) translateY(0); }
      50% { opacity: 1; transform: scale(1.15) translateY(-3px); }
    }
    .anim-steam {
      animation: steamPuff 2s ease-in-out infinite;
    }

    /* 9. Floating Heart Burst */
    @keyframes floatHeartBurst {
      0% { opacity: 1; transform: scale(0.5) translateY(0); }
      100% { opacity: 0; transform: scale(1.5) translateY(-80px) rotate(15deg); }
    }
    .floating-heart {
      position: absolute;
      pointer-events: none;
      animation: floatHeartBurst 1.3s ease-out forwards;
      z-index: 50;
    }

    /* Soft Paper Texture Background */
    .paper-texture {
      background-color: #FAF6F0;
      background-image: 
        radial-gradient(#d5cbb8 0.6px, transparent 0.6px),
        radial-gradient(#e2d9ca 0.6px, #faf6f0 0.6px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
    }
  </style>
</head>

  <!-- JavaScript for Exact Reel Animation Control & Audio -->
  <script>
    function replayReelAnimation() {
      const scooter = document.getElementById('scooterCoupleGroup');
      const header = document.getElementById('headerSection');
      const scriptText = document.getElementById('saveDateScript');
      const wallBoard = document.getElementById('wallBoard');
      const dateEasel = document.getElementById('dateEaselSign');

      scooter.classList.remove('anim-vespa-drive', 'anim-vespa-idle');
      header.classList.remove('anim-warning-drop');
      scriptText.classList.remove('anim-cursive-write');
      wallBoard.classList.remove('anim-chalk-appear');
      dateEasel.classList.remove('anim-chalk-appear');

      void scooter.offsetWidth;

      scooter.classList.add('anim-vespa-drive');
      header.classList.add('anim-warning-drop');
      scriptText.classList.add('anim-cursive-write');
      wallBoard.classList.add('anim-chalk-appear');
      dateEasel.classList.add('anim-chalk-appear');

      playScooterHorn();
      if (!isPlaying) {
        toggleCuteMusic();
      }
    }

    setTimeout(() => {
      const scooter = document.getElementById('scooterCoupleGroup');
      if (scooter) {
        scooter.classList.remove('anim-vespa-drive');
        scooter.classList.add('anim-vespa-idle');
      }
    }, 2400);

    // Audio Context & Romantic Acoustic Melody Synthesizer (Voh Dekhnay Mein Guitar Chords)
    let audioCtx = null;
    let isPlaying = false;
    let melodyLoop = null;

    function getAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playAcousticPluck(freq, timeOffset = 0, duration = 0.8) {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, ctx.currentTime + timeOffset);

        gain.gain.setValueAtTime(0, ctx.currentTime + timeOffset);
        gain.gain.linearRampToValueAtTime(0.18, ctx.currentTime + timeOffset + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + timeOffset + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(ctx.currentTime + timeOffset);
        osc.stop(ctx.currentTime + timeOffset + duration);
      } catch (e) {}
    }

    function playScooterHorn() {
      try {
        const ctx = getAudio();
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain = ctx.createGain();

        osc1.type = 'sawtooth';
        osc2.type = 'sawtooth';
        osc1.frequency.setValueAtTime(440, ctx.currentTime);
        osc2.frequency.setValueAtTime(554.37, ctx.currentTime);

        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(ctx.destination);

        osc1.start();
        osc2.start();
        osc1.stop(ctx.currentTime + 0.35);
        osc2.stop(ctx.currentTime + 0.35);
      } catch (e) {}
    }

    function toggleCuteMusic() {
      const btnLabel = document.getElementById('musicBtnLabel');
      const icon = document.getElementById('musicNoteIcon');

      if (isPlaying) {
        isPlaying = false;
        clearInterval(melodyLoop);
        icon.innerText = '🔇';
        btnLabel.innerText = 'Music Off';
      } else {
        isPlaying = true;
        icon.innerText = '🎵';
        btnLabel.innerText = 'Playing';

        const chords = [
          [261.63, 329.63, 392.00],
          [293.66, 369.99, 440.00],
          [329.63, 392.00, 493.88],
          [261.63, 329.63, 392.00]
        ];
        let step = 0;

        function playStep() {
          if (!isPlaying) return;
          const chord = chords[step % chords.length];
          chord.forEach((freq, idx) => {
            playAcousticPluck(freq, idx * 0.12, 0.9);
          });
          step++;
        }

        playStep();
        melodyLoop = setInterval(playStep, 750);
      }
    }

    function triggerScooterInteraction(e) {
      playScooterHorn();
      spawnHearts(e.clientX || window.innerWidth / 2, e.clientY || window.innerHeight / 2);
    }

    function spawnHearts(x, y) {
      const card = document.getElementById('cardFrame');
      const rect = card.getBoundingClientRect();
      const relX = x - rect.left;
      const relY = y - rect.top;

      const emojis = ['❤️', '💢', '💖', '💍', '🌸'];
      for (let i = 0; i < 5; i++) {
        const heart = document.createElement('div');
        heart.className = 'floating-heart text-xl';
        heart.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        heart.style.left = (relX + (Math.random() - 0.5) * 60) + 'px';
        heart.style.top = (relY + (Math.random() - 0.5) * 40) + 'px';
        card.appendChild(heart);

        setTimeout(() => heart.remove(), 1400);
      }
    }
  </script>
