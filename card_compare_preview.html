<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Card Comparison Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=MonteCarlo&family=Tangerine:wght@700&family=Alex+Brush&family=Cinzel:wght@400;500;600;700;800&family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/template/style.css">
  <style>
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-cormorant { font-family: 'Cormorant Garamond', 'Playfair Display', serif; }
    .font-bikham { font-family: 'MonteCarlo', 'Tangerine', 'Cormorant Garamond', cursive, serif; font-weight: normal; }
    .font-script { font-family: 'MonteCarlo', 'Tangerine', cursive; }
  </style>
</head>
<body class="bg-[#2b1018] p-6 flex flex-col items-center justify-center min-h-screen">
  <h1 class="text-white font-cinzel text-xl mb-6 tracking-widest uppercase">Side-by-Side Card Comparison</h1>
  <div class="flex flex-row gap-8 items-center justify-center flex-wrap">

    <!-- Card 1: Haldi -->
    <div class="w-[315px] shrink-0 relative overflow-hidden bg-white border border-[#e5c4b0]/80 rounded-2xl shadow-2xl">
      <div class="relative w-full aspect-[9/16] overflow-hidden">
        <img src="assets/template/card3.png" alt="Haldi Utsav" class="w-full h-full object-cover object-center"/>
        <div class="absolute top-[23%] inset-x-[8%] bottom-[36%] flex flex-col items-center justify-center text-center pointer-events-none select-none">
          <h3 class="font-bikham text-4xl sm:text-5xl text-[#964860] leading-none mb-1 font-normal drop-shadow-xs">
            Turmeric Tales
          </h3>
          <p class="font-cinzel text-[9.5px] sm:text-[10px] uppercase tracking-[0.22em] text-[#9a5416] font-semibold mb-3">
            SPLASHES OF SUNSHINE &amp; BLESSINGS
          </p>
          <div class="flex items-center justify-center gap-1.5 text-[#853e0d] font-cinzel text-[11px] sm:text-[12px] font-bold tracking-[0.2em] uppercase">
            <span>THURSDAY</span>
            <span class="text-[#c49d68] text-sm">|</span>
            <span class="font-bold text-base sm:text-lg text-[#611522] tracking-normal px-0.5">28</span>
            <span class="text-[#c49d68] text-sm">|</span>
            <span>JANUARY</span>
          </div>
          <p class="font-cinzel text-xs font-bold text-[#853e0d] tracking-[0.25em] mt-0.5">2027</p>
          <div class="w-12 h-[0.5px] bg-[#c49d68]/60 my-2.5"></div>
          <p class="font-cinzel text-[11px] uppercase tracking-[0.22em] text-[#9a5416] font-semibold">
            11:00 AM ONWARDS
          </p>
          <p class="font-cinzel text-[12px] sm:text-[12.5px] uppercase tracking-[0.22em] text-[#611522] font-bold mt-1">
            SILK CITY HOTEL
          </p>
        </div>
        <div class="absolute inset-x-0 bottom-0 h-16 bg-gradient-to-t from-[#360912]/80 via-[#360912]/30 to-transparent pointer-events-none"></div>
      </div>
    </div>

    <!-- Card 2: Ring Ceremony -->
    <div class="w-[315px] shrink-0 relative overflow-hidden bg-white border border-[#e5c4b0]/80 rounded-2xl shadow-2xl">
      <div class="relative w-full aspect-[9/16] overflow-hidden">
        <img src="assets/template/card2.png" alt="Ring Ceremony" class="w-full h-full object-cover object-center"/>
        <div class="absolute top-[23%] inset-x-[8%] bottom-[39%] flex flex-col items-center justify-center text-center pointer-events-none select-none text-white">
          <h3 class="font-bikham text-4xl sm:text-5xl text-[#fff4e0] leading-none mb-1 font-normal drop-shadow-xs">
            Ring Ceremony
          </h3>
          <p class="font-cinzel text-[9.5px] sm:text-[10px] uppercase tracking-[0.22em] text-[#f3e0aa] font-semibold mb-3">
            EXCHANGE OF RINGS, MUSIC &amp; SANGEET
          </p>
          <div class="flex items-center justify-center gap-1.5 text-[#f3e0aa] font-cinzel text-[11px] sm:text-[12px] font-bold tracking-[0.2em] uppercase">
            <span>THURSDAY</span>
            <span class="text-[#d4af37] text-sm">|</span>
            <span class="font-bold text-base sm:text-lg text-white tracking-normal px-0.5">28</span>
            <span class="text-[#d4af37] text-sm">|</span>
            <span>JANUARY</span>
          </div>
          <p class="font-cinzel text-xs font-bold text-[#f3e0aa] tracking-[0.25em] mt-0.5">2027</p>
          <div class="w-12 h-[0.5px] bg-[#d4af37]/70 my-2.5"></div>
          <p class="font-cinzel text-[11px] uppercase tracking-[0.22em] text-[#f3e0aa] font-semibold">
            7:00 PM ONWARDS
          </p>
          <p class="font-cinzel text-[12px] sm:text-[12.5px] uppercase tracking-[0.22em] text-white font-bold mt-1">
            AMAYA
          </p>
        </div>
        <div class="absolute inset-x-0 bottom-0 h-16 bg-gradient-to-t from-[#020b18]/80 via-[#020b18]/30 to-transparent pointer-events-none"></div>
      </div>
    </div>

  </div>
</body>
</html>
