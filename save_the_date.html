<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save The Date | Shreya & Shubham</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Schoolbell&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    .font-heading { font-family: 'Outfit', sans-serif; }
    .font-editorial { font-family: 'Playfair Display', serif; }
    .font-script { font-family: 'Caveat', 'Great Vibes', cursive; }
    .font-chalk { font-family: 'Caveat', 'Schoolbell', cursive; }

    /* Soft Paper Texture Background */
    .paper-texture {
      background-color: #FAF6F0;
      background-image: 
        radial-gradient(#d5cbb8 0.6px, transparent 0.6px),
        radial-gradient(#e2d9ca 0.6px, #faf6f0 0.6px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
    }

    #renderCanvas {
      max-width: 100%;
      height: auto;
      aspect-ratio: 504 / 868;
      display: block;
      border-radius: 1rem;
    }
  </style>
</head>
<body class="paper-texture text-[#2b2523] min-h-screen flex flex-col justify-between selection:bg-rose-200 selection:text-rose-900 overflow-x-hidden">

  <!-- Top Controls Bar -->
  <header class="w-full max-w-md mx-auto pt-4 px-4 flex justify-between items-center z-30">
    <a href="index.html" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-white/90 backdrop-blur-md border border-[#d6c4b2] text-xs font-heading font-semibold text-[#6e202e] hover:bg-[#6e202e] hover:text-white transition shadow-xs">
      <span>📜</span> Main Wedding Card
    </a>

    <div class="flex items-center gap-2">
      <!-- Replay Video Button -->
      <button onclick="replayVideo()" title="Replay Video" class="px-3 py-1.5 rounded-full bg-white/90 backdrop-blur-md border border-[#d6c4b2] text-xs font-heading font-semibold text-[#6e202e] hover:bg-rose-50 transition shadow-xs flex items-center gap-1">
        <span>🔁</span> <span class="text-[11px]">Replay</span>
      </button>

      <!-- Sound Toggle Button -->
      <button id="soundBtn" onclick="toggleAudio()" class="px-3 py-1.5 rounded-full bg-white/90 backdrop-blur-md border border-[#d6c4b2] text-xs font-heading font-semibold text-[#6e202e] hover:bg-rose-50 transition shadow-xs flex items-center gap-1.5">
        <span id="soundIcon">🔊</span>
        <span class="text-[11px]" id="soundText">Sound On</span>
      </button>
    </div>
  </header>

  <!-- Main Video Canvas Card Container -->
  <main class="w-full max-w-[420px] mx-auto px-4 py-3 flex-1 flex flex-col items-center justify-center relative">
    
    <div class="w-full bg-[#FFFDF9] rounded-3xl p-3 shadow-[0_20px_60px_rgba(110,32,46,0.14)] border-2 border-[#E8DCCF] relative overflow-hidden flex flex-col items-center">
      
      <!-- Hidden Original Video Element -->
      <video id="sourceVideo" src="assets/reel.mp4" playsinline loop crossorigin="anonymous" class="hidden"></video>

      <!-- The Seamless Real-Time Pixel-Blended Canvas (NO HTML OVERLAY BOXES) -->
      <div class="relative w-full rounded-2xl overflow-hidden shadow-inner bg-black select-none">
        <canvas id="renderCanvas" width="504" height="868" class="w-full h-full object-cover"></canvas>
      </div>

      <!-- Clean Couple Names & Date Footer -->
      <div class="w-full mt-3 text-center space-y-0.5">
        <h2 class="text-2xl md:text-3xl font-editorial font-bold text-[#6e202e] tracking-wide">
          Shreya & Shubham
        </h2>
        <p class="text-xs md:text-sm font-heading font-bold text-[#3a2c26]">
          Friday, 29th January, 2027 &bull; Varanasi
        </p>
      </div>

    </div>

  </main>

  <!-- Bottom Link to Full Invitation -->
  <footer class="w-full max-w-md mx-auto py-3 px-4 text-center z-20">
    <div class="flex items-center justify-center gap-2 text-xs text-[#705649] font-heading">
      <span>Looking for ceremonies & venue details?</span>
      <a href="index.html" class="font-bold text-[#6e202e] underline hover:text-black">
        Open Wedding Card ›
      </a>
    </div>
  </footer>

  <!-- Seamless Canvas Inpainting Engine -->
  <script>
    const video = document.getElementById('sourceVideo');
    const canvas = document.getElementById('renderCanvas');
    const ctx = canvas.getContext('2d');

    const soundBtn = document.getElementById('soundBtn');
    const soundIcon = document.getElementById('soundIcon');
    const soundText = document.getElementById('soundText');

    // Start video playback
    video.muted = false;
    video.play().catch(() => {
      video.muted = true;
      video.play();
      soundIcon.innerText = '🔇';
      soundText.innerText = 'Unmute';
    });

    function toggleAudio() {
      if (video.muted) {
        video.muted = false;
        soundIcon.innerText = '🔊';
        soundText.innerText = 'Sound On';
      } else {
        video.muted = true;
        soundIcon.innerText = '🔇';
        soundText.innerText = 'Unmute';
      }
    }

    function replayVideo() {
      video.currentTime = 0;
      video.play();
    }

    // Main 60fps Real-Time Seamless Rendering Loop
    function renderFrame() {
      if (video.readyState >= 2) {
        // 1. Draw raw video frame onto canvas
        ctx.drawImage(video, 0, 0, 504, 868);

        // =========================================================================
        // A. SEAMLESS INPAINT: "November." -> "January."
        // =========================================================================
        const skyGrad = ctx.createLinearGradient(0, 88, 0, 114);
        skyGrad.addColorStop(0, 'rgb(210, 212, 214)');
        skyGrad.addColorStop(0.5, 'rgb(214, 218, 217)');
        skyGrad.addColorStop(1, 'rgb(223, 224, 224)');

        ctx.save();
        ctx.fillStyle = skyGrad;
        ctx.fillRect(238, 88, 112, 24);

        // Render "January." in matching font and color
        ctx.font = '500 13px "Outfit", -apple-system, sans-serif';
        ctx.fillStyle = '#1e303f';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText('January.', 240, 105.5);
        ctx.restore();

        // =========================================================================
        // B. SEAMLESS INPAINT: Mounted Blackboard -> "Shreya & Shubham"
        // =========================================================================
        ctx.save();
        const slateGrad = ctx.createLinearGradient(343, 620, 382, 686);
        slateGrad.addColorStop(0, '#1c2420');
        slateGrad.addColorStop(0.4, '#212a24');
        slateGrad.addColorStop(1, '#1a221d');

        ctx.fillStyle = slateGrad;
        ctx.fillRect(343, 620, 39, 66);

        // Soft chalk dust grain
        ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
        for (let i = 0; i < 70; i++) {
          const rx = 343 + Math.random() * 39;
          const ry = 620 + Math.random() * 66;
          ctx.fillRect(rx, ry, 1, 1);
        }

        // Draw chalk text
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(255, 255, 255, 0.65)';
        ctx.shadowBlur = 1.2;

        // "Shreya"
        ctx.font = 'bold 9.5px "Caveat", "Schoolbell", cursive';
        ctx.fillStyle = '#FAFAFA';
        ctx.fillText('Shreya', 362.5, 638);

        // "&"
        ctx.font = 'italic 10.5px "Playfair Display", serif';
        ctx.fillStyle = '#E59883';
        ctx.fillText('&', 362.5, 653);

        // "Shubham"
        ctx.font = 'bold 9.5px "Caveat", "Schoolbell", cursive';
        ctx.fillStyle = '#FAFAFA';
        ctx.fillText('Shubham', 362.5, 668);
        ctx.restore();

        // =========================================================================
        // C. SEAMLESS INPAINT: Sidewalk Easel -> "29.01.27"
        // =========================================================================
        ctx.save();
        const easelGrad = ctx.createLinearGradient(346, 756, 382, 786);
        easelGrad.addColorStop(0, '#161d18');
        easelGrad.addColorStop(1, '#111713');

        ctx.fillStyle = easelGrad;
        ctx.fillRect(346, 756, 36, 30);

        // Micro dust
        ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
        for (let i = 0; i < 30; i++) {
          const rx = 346 + Math.random() * 36;
          const ry = 756 + Math.random() * 30;
          ctx.fillRect(rx, ry, 1, 1);
        }

        // Draw "29.01" and "27"
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(255, 255, 255, 0.55)';
        ctx.shadowBlur = 1;

        ctx.font = 'bold 8.5px "Outfit", sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText('29.01', 364, 768);

        ctx.font = 'bold 7.5px "Outfit", sans-serif';
        ctx.fillStyle = '#FFCDD2';
        ctx.fillText('27', 364, 778);
        ctx.restore();
      }

      requestAnimationFrame(renderFrame);
    }

    requestAnimationFrame(renderFrame);
  </script>
</body>
</html>
